<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Nuestra Historia</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: #09090d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .corazon {
            font-size: 50px;
            margin-bottom: 20px;
            animation: latido 2s infinite;
        }

        h1 {
            font-size: 38px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .subtitulo {
            opacity: 0.6;
            margin-bottom: 40px;
            font-size: 15px;
        }

        .tarjeta {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 30px 25px;
        }

        .tarjeta h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .usuario {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .usuario button {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: white;
            font-size: 15px;
        }

        .usuario button.activo {
            background: rgba(255,80,120,0.2);
            border-color: rgba(255,80,120,0.5);
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25);
            color: white;
            font-size: 16px;
            outline: none;
        }

        .boton {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:disabled {
            opacity: 0.6;
        }

        .mensaje {
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
            opacity: 0.8;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            color: white;
            opacity: 0.5;
            text-decoration: none;
            font-size: 14px;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="corazon">❤️</div>

    <h1>Nuestra Historia</h1>

    <p class="subtitulo">
        Miguel & Hannia
    </p>

    <div class="tarjeta">

        <h2>¿Quién eres?</h2>

        <div class="usuario">

            <button
                id="miguelBtn"
                class="activo"
                onclick="seleccionarUsuario('Miguel')">
                Miguel
            </button>

            <button
                id="hanniaBtn"
                onclick="seleccionarUsuario('Hannia')">
                Hannia
            </button>

        </div>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
        >

        <button
            id="entrarBtn"
            class="boton"
            onclick="entrar()">
            Entrar ❤️
        </button>

        <div id="mensaje" class="mensaje"></div>

    </div>

    <a href="index.html" class="volver">
        ← Volver
    </a>

</div>

<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://glnjxtnzfaxwzkeovqbn.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_SO2UD4TJylooKs9dQaNAaw_oGeW9tuy";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // USUARIOS
    // ==========================================

    const usuarios = {

        Miguel: "moralesguzmanmiguelangel123@gmail.com",

        Hannia: "hannia28@gmail.com"

    };


    let usuarioSeleccionado = "Miguel";


    // ==========================================
    // SELECCIONAR USUARIO
    // ==========================================

    function seleccionarUsuario(usuario) {

        usuarioSeleccionado = usuario;

        document
            .getElementById("miguelBtn")
            .classList.remove("activo");

        document
            .getElementById("hanniaBtn")
            .classList.remove("activo");


        if (usuario === "Miguel") {

            document
                .getElementById("miguelBtn")
                .classList.add("activo");

        } else {

            document
                .getElementById("hanniaBtn")
                .classList.add("activo");

        }


        document.getElementById("password").value = "";

        document.getElementById("mensaje").textContent = "";

    }


    // ==========================================
    // INICIAR SESIÓN
    // ==========================================

    async function entrar() {

        const password =
            document
                .getElementById("password")
                .value
                .trim();

        const mensaje =
            document.getElementById("mensaje");

        const boton =
            document.getElementById("entrarBtn");


        if (!password) {

            mensaje.textContent =
                "Escribe tu contraseña ❤️";

            return;

        }


        const email =
            usuarios[usuarioSeleccionado];


        boton.disabled = true;

        boton.textContent = "Entrando...";


        mensaje.textContent = "";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(error);

                mensaje.textContent =
                    "Contraseña incorrecta ❤️";

                boton.disabled = false;

                boton.textContent = "Entrar ❤️";

                return;

            }


            if (data.session) {

                mensaje.textContent =
                    "Bienvenido, " +
                    usuarioSeleccionado +
                    " ❤️";


                setTimeout(function() {

                    window.location.href =
                        "recuerdos.html";

                }, 700);

            }

        } catch (error) {

            console.error(error);

            mensaje.textContent =
                "Ocurrió un error al iniciar sesión.";

            boton.disabled = false;

            boton.textContent = "Entrar ❤️";

        }

    }


    // ==========================================
    // ENTER PARA INICIAR SESIÓN
    // ==========================================

    document
        .getElementById("password")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                entrar();

            }

        });

</script>

</body>
</html>

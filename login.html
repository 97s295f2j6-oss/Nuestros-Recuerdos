<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Nuestra Historia</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: #09090d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .contenedor {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .corazon {
            font-size: 75px;
            margin-bottom: 25px;
            animation: latido 1.8s infinite;
        }

        h1 {
            font-size: clamp(48px, 10vw, 70px);
            font-weight: normal;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #aaa;
            font-size: 22px;
            margin-bottom: 60px;
        }

        .tarjeta {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 28px;
            padding: 45px 35px;
        }

        .tarjeta h2 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 35px;
        }

        .usuario {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .usuario button {
            flex: 1;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .usuario button.activo {
            background: rgba(255,80,120,0.2);
            border-color: #c93661;
        }

        input {
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 19px;
            outline: none;
        }

        input:focus {
            border-color: #c93661;
        }

        .boton {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #111;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:disabled {
            opacity: 0.5;
        }

        .mensaje {
            margin-top: 25px;
            min-height: 25px;
            font-size: 16px;
            color: #ddd;
        }

        .volver {
            display: inline-block;
            margin-top: 30px;
            color: white;
            opacity: 0.5;
            text-decoration: none;
            font-size: 16px;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 600px) {

            .tarjeta {
                padding: 35px 25px;
            }

            .usuario {
                gap: 12px;
            }

            .usuario button {
                font-size: 17px;
                padding: 17px 10px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="corazon">❤️</div>

    <h1>Nuestra Historia</h1>

    <p class="subtitulo">
        Miguel & Hannia
    </p>

    <div class="tarjeta">

        <h2>¿Quién eres?</h2>

        <div class="usuario">

            <button
                id="miguelBtn"
                class="activo"
                onclick="seleccionarUsuario('Miguel')">
                Miguel
            </button>

            <button
                id="hanniaBtn"
                onclick="seleccionarUsuario('Hannia')">
                Hannia
            </button>

        </div>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
        >

        <button
            id="entrarBtn"
            class="boton"
            onclick="entrar()">
            Entrar ❤️
        </button>

        <div id="mensaje" class="mensaje"></div>

    </div>

    <a href="index.html" class="volver">
        ← Volver
    </a>

</div>

<script>

    // ==========================================
    // CONFIGURACIÓN SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://glnjxtnzfaxwzkeovqbn.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_SO2UD4TJylooKs9dQaNAaw_oGeW9tuy";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // USUARIO SELECCIONADO
    // ==========================================

    let usuarioSeleccionado = "Miguel";


    function seleccionarUsuario(usuario) {

        usuarioSeleccionado = usuario;

        document
            .getElementById("miguelBtn")
            .classList.remove("activo");

        document
            .getElementById("hanniaBtn")
            .classList.remove("activo");


        if (usuario === "Miguel") {

            document
                .getElementById("miguelBtn")
                .classList.add("activo");

        } else {

            document
                .getElementById("hanniaBtn")
                .classList.add("activo");

        }

        document
            .getElementById("password")
            .value = "";

        document
            .getElementById("mensaje")
            .textContent = "";
    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function entrar() {

        const password =
            document
                .getElementById("password")
                .value
                .trim();

        const mensaje =
            document.getElementById("mensaje");

        const boton =
            document.getElementById("entrarBtn");


        if (!password) {

            mensaje.textContent =
                "Escribe tu contraseña ❤️";

            return;
        }


        // Correos registrados en Supabase Auth

        let email;

        if (usuarioSeleccionado === "Miguel") {

            email =
                "moralesguzmanmiguelangel123@gmail.com";

        } else {

            email =
                "hannia28@gmail.com";

        }


        boton.disabled = true;

        boton.textContent =
            "Entrando... ❤️";

        mensaje.textContent = "";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(error);

                mensaje.textContent =
                    "Contraseña incorrecta ❤️";

                boton.disabled = false;

                boton.textContent =
                    "Entrar ❤️";

                return;
            }


            if (data.session) {

                mensaje.textContent =
                    "Bienvenido, " +
                    usuarioSeleccionado +
                    " ❤️";


                setTimeout(() => {

                    window.location.href =
                        "recuerdos.html";

                }, 700);

            }

        } catch (error) {

            console.error(error);

            mensaje.textContent =
                "Ocurrió un error al iniciar sesión.";

            boton.disabled = false;

            boton.textContent =
                "Entrar ❤️";
        }
    }

</script>

</body>
</html>

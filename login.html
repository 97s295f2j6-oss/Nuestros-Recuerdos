<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrar | Nuestra Historia</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: #fff;
            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(196, 35, 91, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(190, 30, 90, 0.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 70, 130, 0.08),
                    transparent 25%
                ),
                #08070b;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
            position: relative;
        }


        /* =====================================================
           FONDO
        ===================================================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255, 70, 120, 0.08),
                    transparent 2px
                ),
                radial-gradient(
                    circle at 70% 20%,
                    rgba(255, 120, 160, 0.10),
                    transparent 2px
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(255, 70, 120, 0.08),
                    transparent 2px
                );

            background-size:
                180px 180px,
                230px 230px,
                260px 260px;

            pointer-events: none;
            z-index: 0;
        }


        /* =====================================================
           PARTÍCULAS
        ===================================================== */

        .particula {
            position: fixed;
            width: 3px;
            height: 3px;

            background: #ff789e;
            border-radius: 50%;

            box-shadow:
                0 0 8px rgba(255, 90, 130, 0.8);

            opacity: 0.55;

            animation:
                flotar 7s ease-in-out infinite;

            pointer-events: none;
            z-index: 0;
        }

        .p1 {
            left: 12%;
            top: 18%;
            animation-delay: 0s;
        }

        .p2 {
            left: 82%;
            top: 25%;
            animation-delay: 2s;
        }

        .p3 {
            left: 25%;
            top: 68%;
            animation-delay: 4s;
        }

        .p4 {
            left: 88%;
            top: 73%;
            animation-delay: 1s;
        }

        .p5 {
            left: 48%;
            top: 10%;
            animation-delay: 3s;
        }


        @keyframes flotar {

            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1);
                opacity: 0.35;
            }

            50% {
                transform:
                    translateY(-18px)
                    scale(1.5);
                opacity: 0.9;
            }
        }


        /* =====================================================
           PÉTALOS
        ===================================================== */

        .petalo {
            position: fixed;

            width: 13px;
            height: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ff668e,
                    #b51f52
                );

            border-radius:
                80% 20% 80% 20%;

            opacity: 0.35;

            transform: rotate(35deg);

            animation:
                caer 10s linear infinite;

            pointer-events: none;
            z-index: 0;
        }

        .petalo:nth-of-type(7) {
            left: 8%;
            animation-delay: 1s;
        }

        .petalo:nth-of-type(8) {
            left: 91%;
            animation-delay: 4s;
        }

        .petalo:nth-of-type(9) {
            left: 18%;
            animation-delay: 7s;
        }

        .petalo:nth-of-type(10) {
            left: 78%;
            animation-delay: 2s;
        }


        @keyframes caer {

            0% {
                top: -10%;
                transform:
                    translateX(0)
                    rotate(20deg);
                opacity: 0;
            }

            15% {
                opacity: 0.4;
            }

            50% {
                transform:
                    translateX(40px)
                    rotate(180deg);
            }

            100% {
                top: 110%;
                transform:
                    translateX(-30px)
                    rotate(360deg);
                opacity: 0;
            }
        }


        /* =====================================================
           CONTENEDOR
        ===================================================== */

        .contenedor {
            width: 100%;
            max-width: 850px;

            padding:
                75px 25px
                55px;

            text-align: center;

            position: relative;
            z-index: 2;
        }


        /* =====================================================
           CORAZÓN PRINCIPAL
        ===================================================== */

        .corazon-principal {
            width: 125px;
            height: 125px;

            margin:
                0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 78px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 70, 90, 0.20),
                    rgba(80, 10, 30, 0.08)
                );

            box-shadow:
                0 0 35px rgba(255, 50, 90, 0.20),
                inset 0 0 30px rgba(255, 70, 120, 0.08);

            animation:
                latido 2s ease-in-out infinite;
        }


        @keyframes latido {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        h1 {
            font-size:
                clamp(48px, 10vw, 82px);

            line-height: 0.95;

            font-weight: normal;

            letter-spacing: -2px;

            text-shadow:
                0 0 25px rgba(255, 100, 140, 0.10);

            margin-bottom: 24px;
        }


        .separador {
            width: 280px;
            max-width: 75%;

            height: 1px;

            margin:
                0 auto 24px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d34a72,
                    transparent
                );

            position: relative;
        }

        .separador::after {
            content: "♡";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background: #08070b;

            padding: 0 15px;

            color: #ef668d;

            font-size: 27px;
        }


        .subtitulo {
            color: #ed9ab3;

            font-size:
                clamp(21px, 4vw, 28px);

            margin-bottom: 58px;

            letter-spacing: 1px;
        }


        /* =====================================================
           TARJETA LOGIN
        ===================================================== */

        .tarjeta {

            width: 100%;

            padding:
                45px 55px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );

            border:
                1px solid rgba(255, 92, 137, 0.42);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.55),
                0 0 35px rgba(190,30,80,0.07),
                inset 0 1px 0 rgba(255,255,255,0.06);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            position: relative;

            overflow: hidden;
        }


        .tarjeta::before {

            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff779d,
                    transparent
                );

            box-shadow:
                0 0 20px #ff4d7d;

            opacity: 0.8;
        }


        .tarjeta h2 {

            font-size:
                clamp(30px, 6vw, 42px);

            font-weight: normal;

            margin-bottom: 35px;
        }


        /* =====================================================
           USUARIOS
        ===================================================== */

        .usuario {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;

            margin-bottom: 24px;
        }


        .usuario button {

            position: relative;

            padding:
                20px 15px;

            border-radius: 20px;

            border:
                1px solid rgba(255,255,255,0.20);

            background:
                rgba(255,255,255,0.025);

            color: #fff;

            font-family: Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;

            cursor: pointer;

            transition:
                all 0.3s ease;

            overflow: hidden;
        }


        .usuario button:hover {

            border-color:
                rgba(255,100,145,0.6);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px rgba(255,50,100,0.08);
        }


        .usuario button.activo {

            background:
                linear-gradient(
                    135deg,
                    rgba(220,48,96,0.72),
                    rgba(166,25,73,0.65)
                );

            border-color:
                #ff6b91;

            box-shadow:
                0 0 25px rgba(255,60,110,0.20),
                inset 0 0 20px rgba(255,130,160,0.10);
        }


        .usuario button.activo::after {

            content: "♡";

            position: absolute;

            right: 18px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #ffd3df;

            font-size: 22px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .campo {

            position: relative;

            margin-bottom: 22px;
        }


        .campo-icono {

            position: absolute;

            left: 20px;
            top: 50%;

            transform:
                translateY(-50%);

            font-size: 22px;

            opacity: 0.65;

            pointer-events: none;
        }


        input {

            width: 100%;

            padding:
                20px
                55px;

            border-radius: 19px;

            border:
                1px solid rgba(255,255,255,0.18);

            background:
                rgba(0,0,0,0.28);

            color: white;

            font-family: Georgia,
                "Times New Roman",
                serif;

            font-size: 19px;

            outline: none;

            transition:
                all 0.3s ease;
        }


        input::placeholder {
            color: #9e9299;
        }


        input:focus {

            border-color:
                #e75a82;

            box-shadow:
                0 0 0 3px
                rgba(230,70,110,0.08),
                0 0 25px
                rgba(230,70,110,0.08);
        }


        /* =====================================================
           MOSTRAR CONTRASEÑA
        ===================================================== */

        .mostrar-password {

            position: absolute;

            right: 18px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #ee6c91;

            font-size: 21px;

            cursor: pointer;

            padding: 5px;
        }


        /* =====================================================
           BOTÓN ENTRAR
        ===================================================== */

        .boton {

            width: 100%;

            padding: 20px;

            border: none;

            border-radius: 50px;

            background:
                linear-gradient(
                    100deg,
                    #d93267,
                    #ed527d,
                    #d93267
                );

            background-size: 200% 100%;

            color: white;

            font-family: Georgia,
                "Times New Roman",
                serif;

            font-size: 22px;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(213,40,95,0.25);

            transition:
                all 0.35s ease;
        }


        .boton:hover {

            background-position:
                100% 0;

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(230,55,110,0.35);
        }


        .boton:active {

            transform:
                translateY(1px)
                scale(0.99);
        }


        .boton:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =====================================================
           SEGURIDAD
        ===================================================== */

        .privado {

            margin-top: 27px;

            color: #b9aab1;

            font-size: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }


        .privado span {
            color: #ee6c91;
        }


        /* =====================================================
           MENSAJE
        ===================================================== */

        .mensaje {

            margin-top: 20px;

            min-height: 25px;

            font-size: 16px;

            color: #ff9db7;

            transition:
                opacity 0.3s ease;
        }


        /* =====================================================
           FRASE
        ===================================================== */

        .frase {

            margin:
                70px auto 35px;

            max-width: 600px;

            color: #c9b9c0;

            font-size:
                clamp(18px, 4vw, 23px);

            line-height: 1.7;

            position: relative;
        }


        .frase::before {

            content: "“";

            display: block;

            color: #c84470;

            font-size: 50px;

            line-height: 20px;

            margin-bottom: 15px;
        }


        .frase::after {

            content: "”";

            display: block;

            color: #c84470;

            font-size: 50px;

            line-height: 20px;

            margin-top: 10px;
        }


        /* =====================================================
           VOLVER
        ===================================================== */

        .volver {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #d9869e;

            text-decoration: none;

            font-size: 17px;

            border-bottom:
                1px solid
                rgba(217,134,158,0.45);

            padding-bottom: 4px;

            transition:
                all 0.3s ease;
        }


        .volver:hover {

            color: #ff9bb5;

            border-color:
                #ff799b;

            transform:
                translateY(-2px);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            .contenedor {

                padding:
                    45px 18px
                    40px;
            }


            .corazon-principal {

                width: 105px;
                height: 105px;

                font-size: 65px;

                margin-bottom: 25px;
            }


            h1 {

                font-size:
                    clamp(45px, 13vw, 65px);

                letter-spacing:
                    -1px;
            }


            .subtitulo {

                margin-bottom: 40px;
            }


            .tarjeta {

                padding:
                    35px 22px;

                border-radius: 27px;
            }


            .usuario {

                gap: 10px;
            }


            .usuario button {

                font-size: 17px;

                padding:
                    18px 10px;
            }


            .usuario button.activo::after {

                right: 10px;

                font-size: 17px;
            }


            input {

                font-size: 18px;

                padding:
                    19px 52px;
            }


            .boton {

                font-size: 20px;

                padding: 19px;
            }


            .frase {

                margin-top: 55px;
            }
        }


        @media (max-width: 380px) {

            .tarjeta {

                padding:
                    30px 17px;
            }


            .usuario button {

                font-size: 16px;
            }
        }

    </style>
</head>


<body>


    <!-- Partículas -->

    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>


    <!-- Pétalos -->

    <div class="petalo"></div>
    <div class="petalo"></div>
    <div class="petalo"></div>
    <div class="petalo"></div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="contenedor">


        <!-- Corazón -->

        <div class="corazon-principal">
            ❤️
        </div>


        <!-- Título -->

        <h1>
            Nuestra<br>
            Historia
        </h1>


        <div class="separador"></div>


        <p class="subtitulo">
            Miguel &amp; Hannia
        </p>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <section class="tarjeta">


            <h2>
                ¿Quién eres?
            </h2>


            <!-- Usuarios -->

            <div class="usuario">


                <button
                    id="miguelBtn"
                    class="activo"
                    onclick="seleccionarUsuario('Miguel')">

                    ♡ &nbsp; Miguel

                </button>


                <button
                    id="hanniaBtn"
                    onclick="seleccionarUsuario('Hannia')">

                    ♡ &nbsp; Hannia

                </button>


            </div>


            <!-- Contraseña -->

            <div class="campo">

                <span class="campo-icono">
                    🔒
                </span>


                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    onkeydown="manejarEnter(event)"
                >


                <button
                    type="button"
                    class="mostrar-password"
                    id="mostrarPassword"
                    onclick="mostrarOcultarPassword()"
                    aria-label="Mostrar contraseña">

                    ♡

                </button>

            </div>


            <!-- Entrar -->

            <button
                id="entrarBtn"
                class="boton"
                onclick="entrar()">

                Entrar ♡

            </button>


            <!-- Seguridad -->

            <div class="privado">

                <span>♡</span>

                Solo tú y yo tenemos acceso
                a nuestra historia

                <span>♥</span>

            </div>


            <!-- Mensaje -->

            <div
                id="mensaje"
                class="mensaje">
            </div>


        </section>


        <!-- =================================================
             FRASE
        ================================================== -->

        <div class="frase">

            Cada recuerdo, cada momento,
            cada latido... es nuestro.

        </div>


        <!-- Volver -->

        <a
            href="index.html"
            class="volver">

            ← Volver

        </a>


    </main>



    <script>


        // ==================================================
        // SUPABASE
        // ==================================================

        const SUPABASE_URL =
            "https://glnjxtnzfaxwzkeovqbn.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_SO2UD4TJylooKs9dQaNAaw_oGeW9tuy";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // ==================================================
        // USUARIO SELECCIONADO
        // ==================================================

        let usuarioSeleccionado =
            "Miguel";



        function seleccionarUsuario(usuario) {

            usuarioSeleccionado =
                usuario;


            const miguel =
                document.getElementById(
                    "miguelBtn"
                );


            const hannia =
                document.getElementById(
                    "hanniaBtn"
                );


            miguel.classList.remove(
                "activo"
            );


            hannia.classList.remove(
                "activo"
            );


            if (usuario === "Miguel") {

                miguel.classList.add(
                    "activo"
                );

            } else {

                hannia.classList.add(
                    "activo"
                );

            }


            document.getElementById(
                "password"
            ).value = "";


            document.getElementById(
                "mensaje"
            ).textContent = "";

        }



        // ==================================================
        // MOSTRAR / OCULTAR PASSWORD
        // ==================================================

        function mostrarOcultarPassword() {

            const input =
                document.getElementById(
                    "password"
                );


            const boton =
                document.getElementById(
                    "mostrarPassword"
                );


            if (
                input.type === "password"
            ) {

                input.type = "text";

                boton.textContent = "◉";

            } else {

                input.type = "password";

                boton.textContent = "♡";

            }

        }



        // ==================================================
        // ENTER PARA INICIAR SESIÓN
        // ==================================================

        function manejarEnter(event) {

            if (
                event.key === "Enter"
            ) {

                entrar();

            }

        }



        // ==================================================
        // LOGIN
        // ==================================================

        async function entrar() {


            const password =
                document
                    .getElementById("password")
                    .value
                    .trim();


            const mensaje =
                document.getElementById(
                    "mensaje"
                );


            const boton =
                document.getElementById(
                    "entrarBtn"
                );


            // ----------------------------------------------
            // VALIDAR PASSWORD
            // ----------------------------------------------

            if (!password) {

                mensaje.textContent =
                    "Escribe tu contraseña ❤️";

                return;

            }


            // ----------------------------------------------
            // CORREO SEGÚN USUARIO
            // ----------------------------------------------

            let email;


            if (
                usuarioSeleccionado ===
                "Miguel"
            ) {

                email =
                    "moralesguzmanmiguelangel123@gmail.com";

            } else {

                email =
                    "hannia28@gmail.com";

            }


            // ----------------------------------------------
            // ESTADO BOTÓN
            // ----------------------------------------------

            boton.disabled = true;

            boton.textContent =
                "Entrando... ♡";

            mensaje.textContent = "";


            try {


                // ------------------------------------------
                // SUPABASE AUTH
                // ------------------------------------------

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });



                // ------------------------------------------
                // ERROR
                // ------------------------------------------

                if (error) {

                    console.error(
                        "Error Supabase:",
                        error
                    );


                    mensaje.textContent =
                        "Contraseña incorrecta ❤️";


                    boton.disabled =
                        false;


                    boton.textContent =
                        "Entrar ♡";


                    return;

                }



                // ------------------------------------------
                // SESIÓN CORRECTA
                // ------------------------------------------

                if (data.session) {


                    mensaje.textContent =
                        "Bienvenido, " +
                        usuarioSeleccionado +
                        " ❤️";


                    boton.textContent =
                        "Bienvenido ❤️";


                    setTimeout(() => {

                        window.location.href =
                            "recuerdos.html";

                    }, 700);

                }


            } catch (error) {


                console.error(
                    "Error:",
                    error
                );


                mensaje.textContent =
                    "Ocurrió un error al iniciar sesión.";


                boton.disabled =
                    false;


                boton.textContent =
                    "Entrar ♡";

            }

        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Nuestra Historia</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: white;

            background:
                radial-gradient(
                    circle at 50% 12%,
                    rgba(210, 35, 95, 0.17),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 10% 75%,
                    rgba(180, 30, 90, 0.09),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 70, 130, 0.07),
                    transparent 25%
                ),
                #08070b;

            display: flex;
            justify-content: center;

            overflow-x: hidden;

            position: relative;
        }


        /* =====================================================
           PARTÍCULAS
        ===================================================== */

        .particula {
            position: fixed;

            width: 3px;
            height: 3px;

            background: #ff789e;

            border-radius: 50%;

            box-shadow:
                0 0 8px rgba(255, 90, 130, 0.8);

            opacity: 0.5;

            animation:
                flotar 7s ease-in-out infinite;

            pointer-events: none;

            z-index: 0;
        }

        .p1 {
            left: 12%;
            top: 18%;
        }

        .p2 {
            left: 82%;
            top: 25%;
            animation-delay: 2s;
        }

        .p3 {
            left: 25%;
            top: 68%;
            animation-delay: 4s;
        }

        .p4 {
            left: 88%;
            top: 73%;
            animation-delay: 1s;
        }

        .p5 {
            left: 48%;
            top: 10%;
            animation-delay: 3s;
        }


        @keyframes flotar {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-16px) scale(1.5);
                opacity: 0.85;
            }
        }


        /* =====================================================
           PÉTALOS
        ===================================================== */

        .petalo {
            position: fixed;

            width: 11px;
            height: 19px;

            background:
                linear-gradient(
                    135deg,
                    #ff668e,
                    #a91f50
                );

            border-radius:
                80% 20% 80% 20%;

            opacity: 0.3;

            animation:
                caer 11s linear infinite;

            pointer-events: none;

            z-index: 0;
        }

        .petalo-1 {
            left: 8%;
            animation-delay: 1s;
        }

        .petalo-2 {
            left: 91%;
            animation-delay: 4s;
        }

        .petalo-3 {
            left: 18%;
            animation-delay: 7s;
        }

        .petalo-4 {
            left: 78%;
            animation-delay: 2s;
        }


        @keyframes caer {

            0% {
                top: -10%;
                transform:
                    translateX(0)
                    rotate(20deg);
                opacity: 0;
            }

            15% {
                opacity: 0.35;
            }

            50% {
                transform:
                    translateX(35px)
                    rotate(180deg);
            }

            100% {
                top: 110%;
                transform:
                    translateX(-25px)
                    rotate(360deg);
                opacity: 0;
            }
        }


        /* =====================================================
           CONTENEDOR
        ===================================================== */

        .contenedor {

            width: 100%;

            max-width: 760px;

            padding:
                48px 22px
                35px;

            text-align: center;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           CORAZÓN PRINCIPAL
        ===================================================== */

        .corazon-principal {

            width: 82px;
            height: 82px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 55px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 70, 90, 0.18),
                    rgba(80, 10, 30, 0.05)
                );

            box-shadow:
                0 0 30px
                rgba(255, 50, 90, 0.18);

            animation:
                latido 2s ease-in-out infinite;
        }


        @keyframes latido {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.07);
            }
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        h1 {

            font-size:
                clamp(43px, 10vw, 68px);

            line-height: 0.95;

            font-weight: normal;

            letter-spacing: -1.5px;

            margin-bottom: 17px;

            text-shadow:
                0 0 25px
                rgba(255, 100, 140, 0.10);
        }


        /* =====================================================
           SEPARADOR
        ===================================================== */

        .separador {

            width: 230px;

            max-width: 70%;

            height: 1px;

            margin:
                0 auto 18px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d34a72,
                    transparent
                );

            position: relative;
        }


        .separador::after {

            content: "♡";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background: #08070b;

            padding: 0 12px;

            color: #ef668d;

            font-size: 24px;
        }


        /* =====================================================
           SUBTÍTULO
        ===================================================== */

        .subtitulo {

            color: #ed9ab3;

            font-size:
                clamp(19px, 4vw, 25px);

            margin-bottom: 34px;

            letter-spacing: 0.5px;
        }


        /* =====================================================
           TARJETA
        ===================================================== */

        .tarjeta {

            width: 100%;

            padding:
                30px 38px;

            border-radius: 29px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.052),
                    rgba(255,255,255,0.015)
                );

            border:
                1px solid
                rgba(255, 92, 137, 0.40);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.48),

                0 0 30px
                rgba(190,30,80,0.06),

                inset 0 1px 0
                rgba(255,255,255,0.05);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            position: relative;

            overflow: hidden;
        }


        .tarjeta::before {

            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff779d,
                    transparent
                );

            box-shadow:
                0 0 18px #ff4d7d;
        }


        /* =====================================================
           TÍTULO LOGIN
        ===================================================== */

        .tarjeta h2 {

            font-size:
                clamp(28px, 6vw, 38px);

            font-weight: normal;

            margin-bottom: 27px;
        }


        /* =====================================================
           USUARIOS
        ===================================================== */

        .usuario {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;

            margin-bottom: 18px;
        }


        .usuario button {

            position: relative;

            padding:
                16px 10px;

            min-height: 58px;

            border-radius: 18px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            background:
                rgba(255,255,255,0.025);

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;

            cursor: pointer;

            transition:
                all 0.3s ease;
        }


        .usuario button:hover {

            border-color:
                rgba(255,100,145,0.6);

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 20px
                rgba(255,50,100,0.08);
        }


        .usuario button.activo {

            background:
                linear-gradient(
                    135deg,
                    rgba(220,48,96,0.75),
                    rgba(166,25,73,0.68)
                );

            border-color:
                #ff6b91;

            box-shadow:
                0 0 22px
                rgba(255,60,110,0.20),

                inset 0 0 18px
                rgba(255,130,160,0.10);
        }


        .usuario button.activo::after {

            content: "♡";

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #ffd3df;

            font-size: 19px;
        }


        /* =====================================================
           CAMPO PASSWORD
        ===================================================== */

        .campo {

            position: relative;

            margin-bottom: 17px;
        }


        .campo-icono {

            position: absolute;

            left: 17px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 20px;

            opacity: 0.6;

            pointer-events: none;
        }


        input {

            width: 100%;

            height: 58px;

            padding:
                16px 50px;

            border-radius: 18px;

            border:
                1px solid
                rgba(255,255,255,0.17);

            background:
                rgba(0,0,0,0.27);

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;

            outline: none;

            transition:
                all 0.3s ease;
        }


        input::placeholder {
            color: #9e9299;
        }


        input:focus {

            border-color:
                #e75a82;

            box-shadow:
                0 0 0 3px
                rgba(230,70,110,0.07),

                0 0 20px
                rgba(230,70,110,0.07);
        }


        /* =====================================================
           MOSTRAR PASSWORD
        ===================================================== */

        .mostrar-password {

            position: absolute;

            right: 16px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #ee6c91;

            font-size: 21px;

            cursor: pointer;

            padding: 4px;
        }


        /* =====================================================
           BOTÓN ENTRAR
        ===================================================== */

        .boton {

            width: 100%;

            height: 60px;

            padding: 15px;

            border: none;

            border-radius: 50px;

            background:
                linear-gradient(
                    100deg,
                    #d93267,
                    #ed527d,
                    #d93267
                );

            background-size:
                200% 100%;

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 21px;

            cursor: pointer;

            box-shadow:
                0 10px 27px
                rgba(213,40,95,0.24);

            transition:
                all 0.35s ease;
        }


        .boton:hover {

            background-position:
                100% 0;

            transform:
                translateY(-2px);

            box-shadow:
                0 13px 30px
                rgba(230,55,110,0.32);
        }


        .boton:active {

            transform:
                translateY(1px)
                scale(0.99);
        }


        .boton:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =====================================================
           MENSAJE PRIVADO
        ===================================================== */

        .privado {

            margin-top: 21px;

            color: #b9aab1;

            font-size: 15px;

            line-height: 1.4;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;
        }


        .privado span {
            color: #ee6c91;
        }


        /* =====================================================
           MENSAJE DE ERROR / ÉXITO
        ===================================================== */

        .mensaje {

            margin-top: 14px;

            min-height: 22px;

            font-size: 15px;

            color: #ff9db7;
        }


        /* =====================================================
           FRASE
        ===================================================== */

        .frase {

            margin:
                45px auto 28px;

            max-width: 590px;

            color: #c9b9c0;

            font-size:
                clamp(17px, 4vw, 21px);

            line-height: 1.55;

            position: relative;
        }


        .frase::before {

            content: "“";

            display: block;

            color: #c84470;

            font-size: 45px;

            line-height: 20px;

            margin-bottom: 10px;
        }


        .frase::after {

            content: "”";

            display: block;

            color: #c84470;

            font-size: 45px;

            line-height: 20px;

            margin-top: 7px;
        }


        /* =====================================================
           VOLVER
        ===================================================== */

        .volver {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            color: #d9869e;

            text-decoration: none;

            font-size: 16px;

            border-bottom:
                1px solid
                rgba(217,134,158,0.45);

            padding-bottom: 3px;

            transition:
                all 0.3s ease;
        }


        .volver:hover {

            color: #ff9bb5;

            border-color:
                #ff799b;

            transform:
                translateY(-1px);
        }


        /* =====================================================
           IPHONE / PANTALLAS PEQUEÑAS
        ===================================================== */

        @media (max-width: 650px) {

            .contenedor {

                padding:
                    34px 17px
                    30px;
            }


            .corazon-principal {

                width: 78px;
                height: 78px;

                font-size: 51px;

                margin-bottom: 17px;
            }


            h1 {

                font-size:
                    clamp(42px, 12vw, 61px);

                margin-bottom: 14px;
            }


            .separador {

                width: 205px;

                margin-bottom: 15px;
            }


            .subtitulo {

                font-size: 19px;

                margin-bottom: 28px;
            }


            .tarjeta {

                padding:
                    27px 19px;

                border-radius: 25px;
            }


            .tarjeta h2 {

                font-size: 29px;

                margin-bottom: 24px;
            }


            .usuario {

                gap: 10px;

                margin-bottom: 15px;
            }


            .usuario button {

                min-height: 55px;

                padding:
                    15px 8px;

                font-size: 17px;

                border-radius: 17px;
            }


            .usuario button.activo::after {

                right: 9px;

                font-size: 16px;
            }


            input {

                height: 55px;

                font-size: 17px;

                padding:
                    15px 48px;
            }


            .boton {

                height: 57px;

                font-size: 20px;
            }


            .privado {

                margin-top: 18px;

                font-size: 14px;
            }


            .frase {

                margin-top: 38px;

                font-size: 17px;
            }

        }


        /* =====================================================
           IPHONE MUY PEQUEÑO
        ===================================================== */

        @media (max-width: 380px) {

            .contenedor {

                padding:
                    28px 14px
                    25px;
            }


            .corazon-principal {

                width: 70px;
                height: 70px;

                font-size: 46px;
            }


            h1 {

                font-size: 42px;
            }


            .tarjeta {

                padding:
                    24px 15px;
            }


            .tarjeta h2 {

                font-size: 27px;
            }


            .usuario button {

                font-size: 16px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         PARTÍCULAS
    ====================================================== -->

    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>


    <!-- =====================================================
         PÉTALOS
    ====================================================== -->

    <div class="petalo petalo-1"></div>
    <div class="petalo petalo-2"></div>
    <div class="petalo petalo-3"></div>
    <div class="petalo petalo-4"></div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="contenedor">


        <!-- CORAZÓN -->

        <div class="corazon-principal">
            ❤️
        </div>


        <!-- TÍTULO -->

        <h1>
            Nuestra<br>
            Historia
        </h1>


        <div class="separador"></div>


        <p class="subtitulo">
            Miguel &amp; Hannia
        </p>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <section class="tarjeta">


            <h2>
                ¿Quién eres?
            </h2>


            <!-- USUARIOS -->

            <div class="usuario">

                <button
                    id="miguelBtn"
                    class="activo"
                    onclick="seleccionarUsuario('Miguel')">

                    ♡ &nbsp; Miguel

                </button>


                <button
                    id="hanniaBtn"
                    onclick="seleccionarUsuario('Hannia')">

                    ♡ &nbsp; Hannia

                </button>

            </div>


            <!-- PASSWORD -->

            <div class="campo">

                <span class="campo-icono">
                    🔒
                </span>


                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    onkeydown="manejarEnter(event)"
                >


                <button
                    type="button"
                    class="mostrar-password"
                    id="mostrarPassword"
                    onclick="mostrarOcultarPassword()"
                    aria-label="Mostrar contraseña">

                    ♡

                </button>

            </div>


            <!-- ENTRAR -->

            <button
                id="entrarBtn"
                class="boton"
                onclick="entrar()">

                Entrar ♡

            </button>


            <!-- PRIVACIDAD -->

            <div class="privado">

                <span>♡</span>

                Solo tú y yo tenemos acceso
                a nuestra historia

                <span>♥</span>

            </div>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mensaje">
            </div>


        </section>


        <!-- =================================================
             FRASE
        ================================================== -->

        <div class="frase">

            Cada recuerdo, cada momento,
            cada latido... es nuestro.

        </div>


        <!-- VOLVER -->

        <a
            href="index.html"
            class="volver">

            ← Volver

        </a>


    </main>



    <script>

        // ==================================================
        // SUPABASE
        // ==================================================

        const SUPABASE_URL =
            "https://glnjxtnzfaxwzkeovqbn.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_SO2UD4TJylooKs9dQaNAaw_oGeW9tuy";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==================================================
        // USUARIO SELECCIONADO
        // ==================================================

        let usuarioSeleccionado =
            "Miguel";


        function seleccionarUsuario(usuario) {

            usuarioSeleccionado =
                usuario;


            const miguel =
                document.getElementById(
                    "miguelBtn"
                );


            const hannia =
                document.getElementById(
                    "hanniaBtn"
                );


            miguel.classList.remove(
                "activo"
            );


            hannia.classList.remove(
                "activo"
            );


            if (
                usuario === "Miguel"
            ) {

                miguel.classList.add(
                    "activo"
                );

            } else {

                hannia.classList.add(
                    "activo"
                );

            }


            document.getElementById(
                "password"
            ).value = "";


            document.getElementById(
                "mensaje"
            ).textContent = "";

        }


        // ==================================================
        // MOSTRAR / OCULTAR PASSWORD
        // ==================================================

        function mostrarOcultarPassword() {

            const input =
                document.getElementById(
                    "password"
                );


            const boton =
                document.getElementById(
                    "mostrarPassword"
                );


            if (
                input.type === "password"
            ) {

                input.type = "text";

                boton.textContent = "◉";

            } else {

                input.type = "password";

                boton.textContent = "♡";

            }

        }


        // ==================================================
        // ENTER
        // ==================================================

        function manejarEnter(event) {

            if (
                event.key === "Enter"
            ) {

                entrar();

            }

        }


        // ==================================================
        // LOGIN
        // ==================================================

        async function entrar() {


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value
                    .trim();


            const mensaje =
                document.getElementById(
                    "mensaje"
                );


            const boton =
                document.getElementById(
                    "entrarBtn"
                );


            // ----------------------------------------------
            // VALIDAR PASSWORD
            // ----------------------------------------------

            if (!password) {

                mensaje.textContent =
                    "Escribe tu contraseña ❤️";

                return;

            }


            // ----------------------------------------------
            // CORREO
            // ----------------------------------------------

            let email;


            if (
                usuarioSeleccionado ===
                "Miguel"
            ) {

                email =
                    "moralesguzmanmiguelangel123@gmail.com";

            } else {

                email =
                    "hannia28@gmail.com";

            }


            // ----------------------------------------------
            // BOTÓN
            // ----------------------------------------------

            boton.disabled = true;

            boton.textContent =
                "Entrando... ♡";

            mensaje.textContent = "";


            try {


                // ------------------------------------------
                // SUPABASE AUTH
                // ------------------------------------------

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                // ------------------------------------------
                // ERROR
                // ------------------------------------------

                if (error) {

                    console.error(
                        "Error Supabase:",
                        error
                    );


                    mensaje.textContent =
                        "Contraseña incorrecta ❤️";


                    boton.disabled =
                        false;


                    boton.textContent =
                        "Entrar ♡";


                    return;

                }


                // ------------------------------------------
                // LOGIN CORRECTO
                // ------------------------------------------

                if (data.session) {


                    mensaje.textContent =
                        "Bienvenido, " +
                        usuarioSeleccionado +
                        " ❤️";


                    boton.textContent =
                        "Bienvenido ❤️";


                    setTimeout(() => {

                        window.location.href =
                            "recuerdos.html";

                    }, 700);

                }


            } catch (error) {


                console.error(
                    "Error:",
                    error
                );


                mensaje.textContent =
                    "Ocurrió un error al iniciar sesión.";


                boton.disabled =
                    false;


                boton.textContent =
                    "Entrar ♡";

            }

        }

    </script>

</body>
</html>

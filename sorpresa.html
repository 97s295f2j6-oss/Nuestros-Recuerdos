<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi amor ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 35%, rgba(255, 60, 110, 0.22), transparent 35%),
                #09090d;
            color: white;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .contenedor {
            width: 100%;
            max-width: 520px;
            padding: 30px;
            animation: aparecer 1.5s ease;
        }

        .corazon {
            font-size: 75px;
            animation: latido 2s infinite;
            margin-bottom: 25px;
        }

        .pequeno {
            font-size: 14px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #d96b91;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .mensaje {
            font-size: 19px;
            line-height: 1.8;
            color: rgba(255,255,255,0.75);
            margin-bottom: 40px;
        }

        .sorpresa {
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px 22px;
            box-shadow: 0 0 40px rgba(255, 50, 100, 0.08);
        }

        .sorpresa p {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            padding: 17px 35px;
            border-radius: 50px;
            background: white;
            color: #151015;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 17px;
            transition: 0.3s;
        }

        .boton:hover {
            transform: scale(1.05);
        }

        .corazon-flotante {
            position: absolute;
            bottom: -30px;
            color: #e85b82;
            opacity: 0;
            animation: flotar 8s linear infinite;
        }

        .c1 { left: 15%; animation-delay: 1s; }
        .c2 { left: 70%; animation-delay: 3s; }
        .c3 { left: 40%; animation-delay: 5s; }
        .c4 { left: 85%; animation-delay: 7s; }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        @keyframes flotar {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            15% {
                opacity: 0.6;
            }

            85% {
                opacity: 0.2;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 40px;
            }

            .mensaje {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="corazon-flotante c1">♡</div>
    <div class="corazon-flotante c2">♡</div>
    <div class="corazon-flotante c3">♡</div>
    <div class="corazon-flotante c4">♡</div>

    <div class="contenedor">

        <div class="corazon">❤️</div>

        <div class="pequeno">
            Para alguien muy especial
        </div>

        <h1>
            Feliz cumpleaños,<br>
            mi amor ❤️
        </h1>

        <p class="mensaje">
            Hoy es un día especial porque nació
            una de las personas más importantes
            de mi vida.
            <br><br>
            Y preparé algo especialmente para ti...
        </p>

        <div class="sorpresa">

            <p>
                Hay algo que quiero que veas.
            </p>

            <a href="video.html" class="boton">
                Ver mi sorpresa 🎁
            </a>

        </div>

    </div>

</body>
</html>
